name: App pipeline

# Runs only when application code changes. Terraform changes do not trigger it.
on:
  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app.yml"
  push:
    branches: [main]
    paths:
      - "app/**"
      - ".github/workflows/app.yml"

permissions:
  contents: read

concurrency:
  group: app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: app
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install -r requirements-dev.txt

      - name: Unit tests with coverage gate
        run: pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  build-and-scan:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      IMAGE: separate-pipeline-demo:${{ github.sha }}
      # Pinned so a new Trivy release cannot change scan results unreviewed.
      TRIVY_IMAGE: aquasec/trivy:0.76.2
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t "$IMAGE" app

      - name: Scan image for fixable HIGH/CRITICAL vulnerabilities
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image --scanners vuln --ignore-unfixed \
            --severity HIGH,CRITICAL --exit-code 1 "$IMAGE"

      - name: Generate SBOM (CycloneDX)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock \
            "$TRIVY_IMAGE" image --format cyclonedx --quiet "$IMAGE" > sbom.json

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom-${{ github.sha }}
          path: sbom.json
          retention-days: 30

      - name: Smoke test the running container
        run: |
          docker run -d --name app -p 8080:8080 "$IMAGE"
          curl -sf --retry 20 --retry-all-errors --retry-delay 1 \
            localhost:8080/health | grep -q '"status":"ok"'

      - name: Show app logs on failure
        if: failure()
        run: docker logs app

  publish-and-sign:
    needs: build-and-scan
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Only this job can write packages and request a signing identity.
    permissions:
      contents: read
      packages: write
      id-token: write
    env:
      IMAGE: ghcr.io/${{ github.repository }}
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: push
        run: |
          docker build -t "$IMAGE:$GITHUB_SHA" app
          docker push "$IMAGE:$GITHUB_SHA"
          echo "digest=$(docker inspect --format='{{index .RepoDigests 0}}' "$IMAGE:$GITHUB_SHA")" >> "$GITHUB_OUTPUT"

      - name: Install Cosign
        uses: sigstore/cosign-installer@v3

      - name: Sign image by digest (keyless)
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
        run: cosign sign --yes "$DIGEST"
